name: Prepare signed release draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag on the tested personal commit (e.g. v1.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Check release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) throw new Error("Tag/version mismatch")'
      - name: Install and verify dependencies
        run: |
          npm install --global npm@11.17.0 --ignore-scripts
          npm ci
          npm run audit:dependencies
          npm run test:dependencies
          npm test -- --runInBand
          npx tsc --noEmit
          npm run lint
      - name: Restore signing key
        env:
          STORE_BASE64: ${{ secrets.RELEASE_STORE_FILE_BASE64 }}
        run: |
          test -n "$STORE_BASE64" || { echo "Configure production signing secrets first"; exit 1; }
          umask 077
          printf '%s' "$STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
      - name: Build signed APKs
        working-directory: android
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Prepare checksums and release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cd android/app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS.txt
          cd "$GITHUB_WORKSPACE"
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" android/app/build/outputs/apk/release/*.apk android/app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
