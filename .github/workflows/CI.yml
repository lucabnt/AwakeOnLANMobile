name: CI

on:
  push:
    branches:
      - personal
  pull_request:
    branches:
      - master
      - personal

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download npm packages
        run: |
          npm install --global npm@11.17.0 --ignore-scripts
          npm ci
          npm run audit:dependencies

      - name: Check TypeScript, JavaScript tests, and lint
        run: |
          npx tsc --noEmit
          npm test -- --runInBand
          npm run test:dependencies
          npm run lint

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Android SDK uses Clang inside CMake by default
      - name: Install Clang and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake

      - name: Build
        run: |
          npx react-native build-android --mode=debug # this step is needed for code generation of the C++ turbo module 
          cd android && ./gradlew assembleDebug

      - name: Native security regression tests
        run: |
          clang++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined -pthread \
            -Icpp cpp/tests/security_tests.cpp cpp/utils.cpp cpp/a_wake_on_lan.cpp cpp/net_scan.cpp \
            -o "$RUNNER_TEMP/awakeonlan-security-tests"
          "$RUNNER_TEMP/awakeonlan-security-tests"
